<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina | Your Private Diary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Premium Palette: Warm Greige / Midnight Sand */
            --bg-color: #e0e5ec;
            --text-main: #4a5568;
            --text-muted: #a0aec0;
            --accent: #d4a373; /* Muted Gold */
            --accent-hover: #c59260;
            
            /* Neumorphic Shadows - Light Mode */
            --shadow-light: #ffffff;
            --shadow-dark: #a3b1c6;
            
            /* Dimensions */
            --radius-lg: 24px;
            --radius-md: 16px;
            --radius-sm: 8px;
            
            /* Transitions */
            --trans-speed: 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        [data-theme="dark"] {
            --bg-color: #2d3436;
            --text-main: #dfe6e9;
            --text-muted: #636e72;
            --accent: #fab1a0;
            --shadow-light: #3d4649;
            --shadow-dark: #1e2324;
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: background-color var(--trans-speed), color var(--trans-speed);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        h1, h2, h3, .serif { font-family: 'Playfair Display', serif; }

        /* --- Utilities: The Expensive Look --- */
        .neu-flat {
            background: var(--bg-color);
            box-shadow: 9px 9px 16px var(--shadow-dark), 
                       -9px -9px 16px var(--shadow-light);
            border-radius: var(--radius-lg);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .neu-pressed {
            background: var(--bg-color);
            box-shadow: inset 6px 6px 10px var(--shadow-dark), 
                       inset -6px -6px 10px var(--shadow-light);
            border-radius: var(--radius-md);
        }

        .neu-btn {
            background: var(--bg-color);
            box-shadow: 6px 6px 10px var(--shadow-dark), 
                       -6px -6px 10px var(--shadow-light);
            border-radius: 50px;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .neu-btn:active, .neu-btn.active {
            box-shadow: inset 4px 4px 8px var(--shadow-dark), 
                       inset -4px -4px 8px var(--shadow-light);
            color: var(--accent);
        }

        .neu-icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
            box-shadow: 5px 5px 10px var(--shadow-dark), 
                       -5px -5px 10px var(--shadow-light);
            border: none;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .neu-icon-btn:hover { color: var(--accent); transform: translateY(-2px); }
        .neu-icon-btn:active { transform: translateY(0); box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light); }

        /* --- Layout --- */
        aside {
            width: 280px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 30px;
            z-index: 10;
        }

        main {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- Sidebar --- */
        .brand {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
            padding-left: 15px;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .brand span { color: var(--accent); }

        .nav-group { display: flex; flex-direction: column; gap: 15px; }
        
        .notebook-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 40vh;
            overflow-y: auto;
        }

        .notebook-item {
            padding: 12px 15px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .notebook-item:hover { color: var(--text-main); background: rgba(0,0,0,0.02); }
        .notebook-item.active {
            color: var(--accent);
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            font-weight: 600;
        }

        /* --- Main Content Area --- */
        header {
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .search-bar {
            position: relative;
            width: 300px;
        }

        .search-input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border: none;
            border-radius: 50px;
            background: var(--bg-color);
            box-shadow: inset 4px 4px 8px var(--shadow-dark), 
                       inset -4px -4px 8px var(--shadow-light);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            transition: all 0.3s;
        }
        
        .search-input:focus { box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light); }
        
        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 18px;
            height: 18px;
        }

        .content-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 0 40px 40px 40px;
        }

        /* --- Dashboard Grid --- */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 30px;
            padding-bottom: 40px;
        }

        .entry-card {
            padding: 25px;
            cursor: pointer;
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
            overflow: hidden;
        }

        .entry-card:hover { transform: translateY(-5px); }

        .card-date {
            font-size: 0.8rem;
            color: var(--accent);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin: 0;
            line-height: 1.4;
        }

        .card-preview {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-img-preview {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: var(--radius-sm);
            box-shadow: inset 2px 2px 5px var(--shadow-dark), inset -2px -2px 5px var(--shadow-light);
            margin-top: 10px;
        }

        /* --- Editor Modal --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.open { display: flex; opacity: 1; }

        .editor-container {
            width: 90%;
            max-width: 900px;
            height: 85vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .editor-header {
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .editor-title-input {
            background: transparent;
            border: none;
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            width: 70%;
        }

        .editor-tools {
            padding: 15px 30px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .tool-select {
            background: var(--bg-color);
            border: none;
            padding: 8px 15px;
            border-radius: var(--radius-sm);
            box-shadow: 3px 3px 6px var(--shadow-dark), -3px -3px 6px var(--shadow-light);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            cursor: pointer;
        }

        .editor-body {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            font-size: 1.05rem;
            line-height: 1.8;
            color: var(--text-main);
        }

        .editor-body img {
            max-width: 100%;
            border-radius: var(--radius-md);
            margin: 20px 0;
            box-shadow: 5px 5px 15px var(--shadow-dark), -5px -5px 15px var(--shadow-light);
        }

        .editor-body blockquote {
            border-left: 3px solid var(--accent);
            margin: 20px 0;
            padding-left: 20px;
            font-style: italic;
            color: var(--text-muted);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 10px; opacity: 0.3; }
        ::-webkit-scrollbar-thumb:hover { opacity: 0.6; }

        /* Responsive */
        @media (max-width: 768px) {
            body { flex-direction: column; overflow: auto; }
            aside { width: 100%; padding: 20px; flex-direction: row; align-items: center; justify-content: space-between; }
            .nav-group, .notebook-list { display: none; } /* Simplified mobile nav for now */
            .brand { font-size: 1.4rem; }
            main { height: auto; }
            .content-scroll { padding: 20px; }
            .editor-container { height: 100vh; width: 100%; border-radius: 0; }
        }
        
        .hidden { display: none !important; }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state h3 { font-size: 1.5rem; margin-bottom: 10px; color: var(--text-main); }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <aside class="neu-flat">
        <div class="brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
            Lumina
        </div>

        <div class="nav-group">
            <button class="neu-btn" style="width: 100%; padding: 12px;" onclick="app.showDashboard()">
                <span style="margin-right: 10px;">🏠</span> Dashboard
            </button>
            <button class="neu-btn" style="width: 100%; padding: 12px;" onclick="app.createNotebookPrompt()">
                <span style="margin-right: 10px;">📁</span> New Notebook
            </button>
        </div>

        <div style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); padding-left: 15px; margin-top: 10px;">My Notebooks</div>
        <ul class="notebook-list" id="notebookList">
            <!-- Notebooks injected here -->
        </ul>
        
        <div style="margin-top: auto; display: flex; justify-content: center;">
            <button class="neu-icon-btn" onclick="app.toggleTheme()" title="Toggle Theme">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path></svg>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main>
        <header>
            <div class="search-bar">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" class="search-input" placeholder="Search memories..." onkeyup="app.searchEntries(this.value)">
            </div>
            <div style="display: flex; gap: 15px;">
                <button class="neu-btn" style="padding: 12px 25px; background: var(--accent); color: white;" onclick="app.openEditor()">
                    ✎ New Entry
                </button>
            </div>
        </header>

        <div class="content-scroll">
            <div id="dashboardView">
                <h2 class="serif" style="margin-bottom: 25px; font-size: 2rem;">Recent Memories</h2>
                <div class="dashboard-grid" id="entriesGrid">
                    <!-- Entries injected here -->
                </div>
                <div id="emptyState" class="empty-state hidden">
                    <h3>Your diary is empty</h3>
                    <p>Start writing your story today.</p>
                </div>
            </div>
            
            <div id="notebookView" class="hidden">
                <h2 class="serif" style="margin-bottom: 25px; font-size: 2rem;" id="notebookTitleDisplay">Notebook</h2>
                <div class="dashboard-grid" id="notebookEntriesGrid"></div>
            </div>
        </div>
    </main>

    <!-- Editor Modal -->
    <div class="modal-overlay" id="editorModal">
        <div class="neu-flat editor-container">
            <div class="editor-header">
                <input type="text" class="editor-title-input" id="entryTitle" placeholder="Untitled Memory">
                <div style="display: flex; gap: 10px;">
                    <button class="neu-icon-btn" onclick="document.getElementById('imgUpload').click()" title="Add Image">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                    </button>
                    <input type="file" id="imgUpload" accept="image/*" style="display: none" onchange="app.insertImage(this)">
                    <button class="neu-icon-btn" onclick="app.saveEntry()" title="Save">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
                    </button>
                    <button class="neu-icon-btn" onclick="app.closeEditor()" style="color: #ff7675;" title="Close">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
            </div>
            
            <div class="editor-tools">
                <select class="tool-select" onchange="document.execCommand('formatBlock', false, this.value)">
                    <option value="P">Paragraph</option>
                    <option value="H3">Heading</option>
                    <option value="BLOCKQUOTE">Quote</option>
                </select>
                <button class="neu-icon-btn" style="width: 36px; height: 36px;" onclick="document.execCommand('bold', false, null)"><b>B</b></button>
                <button class="neu-icon-btn" style="width: 36px; height: 36px;" onclick="document.execCommand('italic', false, null)"><i>I</i></button>
                <button class="neu-icon-btn" style="width: 36px; height: 36px;" onclick="document.execCommand('underline', false, null)"><u>U</u></button>
            </div>

            <div class="editor-body neu-pressed" id="editorContent" contenteditable="true" placeholder="Write your thoughts here..."></div>
        </div>
    </div>

    <script>
        class DiaryApp {
            constructor() {
                this.data = JSON.parse(localStorage.getItem('lumina_data')) || {
                    notebooks: [{ id: 'default', name: 'Personal Journal' }],
                    entries: []
                };
                this.currentNotebook = 'all';
                this.editingId = null;
                
                this.init();
            }

            init() {
                this.renderNotebooks();
                this.showDashboard();
                this.applyTheme();
            }

            saveData() {
                localStorage.setItem('lumina_data', JSON.stringify(this.data));
                this.renderNotebooks();
                if(this.currentNotebook === 'all') this.showDashboard();
                else this.showNotebook(this.currentNotebook);
            }

            // --- Navigation & Rendering ---

            showDashboard() {
                this.currentNotebook = 'all';
                document.getElementById('dashboardView').classList.remove('hidden');
                document.getElementById('notebookView').classList.add('hidden');
                
                const grid = document.getElementById('entriesGrid');
                grid.innerHTML = '';
                
                const sortedEntries = [...this.data.entries].sort((a, b) => new Date(b.date) - new Date(a.date));

                if (sortedEntries.length === 0) {
                    document.getElementById('emptyState').classList.remove('hidden');
                } else {
                    document.getElementById('emptyState').classList.add('hidden');
                    sortedEntries.forEach(entry => grid.appendChild(this.createEntryCard(entry)));
                }
            }

            showNotebook(id) {
                this.currentNotebook = id;
                document.getElementById('dashboardView').classList.add('hidden');
                document.getElementById('notebookView').classList.remove('hidden');
                
                const notebook = this.data.notebooks.find(n => n.id === id);
                document.getElementById('notebookTitleDisplay').innerText = notebook ? notebook.name : 'Unknown';

                const grid = document.getElementById('notebookEntriesGrid');
                grid.innerHTML = '';
                
                const filtered = this.data.entries.filter(e => e.notebookId === id).sort((a, b) => new Date(b.date) - new Date(a.date));
                
                if (filtered.length === 0) {
                    grid.innerHTML = '<div class="empty-state"><p>No entries in this notebook yet.</p></div>';
                } else {
                    filtered.forEach(entry => grid.appendChild(this.createEntryCard(entry)));
                }
            }

            createEntryCard(entry) {
                const div = document.createElement('div');
                div.className = 'neu-flat entry-card';
                div.onclick = () => this.openEditor(entry.id);
                
                const dateStr = new Date(entry.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                
                // Extract plain text for preview
                const tempDiv = document.createElement("div");
                tempDiv.innerHTML = entry.content;
                const textPreview = tempDiv.textContent || tempDiv.innerText || "";

                let imgHTML = '';
                if (entry.image) {
                    imgHTML = `<img src="${entry.image}" class="card-img-preview" alt="Memory">`;
                }

                div.innerHTML = `
                    <div class="card-date">${dateStr}</div>
                    <h3 class="card-title serif">${entry.title || 'Untitled'}</h3>
                    <div class="card-preview">${textPreview.substring(0, 100)}...</div>
                    ${imgHTML}
                `;
                return div;
            }

            renderNotebooks() {
                const list = document.getElementById('notebookList');
                list.innerHTML = '';
                
                this.data.notebooks.forEach(nb => {
                    const li = document.createElement('li');
                    li.className = `notebook-item ${this.currentNotebook === nb.id ? 'active' : ''}`;
                    li.innerHTML = `
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                        ${nb.name}
                    `;
                    li.onclick = () => this.showNotebook(nb.id);
                    list.appendChild(li);
                });
            }

            // --- Actions ---

            createNotebookPrompt() {
                const name = prompt("Name your new notebook:");
                if (name) {
                    const newNb = { id: Date.now().toString(), name: name };
                    this.data.notebooks.push(newNb);
                    this.saveData();
                    this.showNotebook(newNb.id);
                }
            }

            openEditor(entryId = null) {
                const modal = document.getElementById('editorModal');
                const titleInput = document.getElementById('entryTitle');
                const contentDiv = document.getElementById('editorContent');
                
                this.editingId = entryId;

                if (entryId) {
                    const entry = this.data.entries.find(e => e.id === entryId);
                    titleInput.value = entry.title;
                    contentDiv.innerHTML = entry.content;
                    // Store image separately if needed, but currently embedded in HTML
                } else {
                    titleInput.value = '';
                    contentDiv.innerHTML = '';
                }

                modal.classList.add('open');
                titleInput.focus();
            }

            closeEditor() {
                document.getElementById('editorModal').classList.remove('open');
                this.editingId = null;
            }

            insertImage(input) {
                if (input.files && input.files[0]) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const imgHtml = `<img src="${e.target.result}" style="max-width:100%">`;
                        document.execCommand('insertHTML', false, imgHtml);
                    };
                    reader.readAsDataURL(input.files[0]);
                }
                input.value = ''; // Reset
            }

            saveEntry() {
                const title = document.getElementById('entryTitle').value;
                const content = document.getElementById('editorContent').innerHTML;
                
                if (!title.trim() && !content.trim()) {
                    this.closeEditor();
                    return;
                }

                if (this.editingId) {
                    // Update
                    const index = this.data.entries.findIndex(e => e.id === this.editingId);
                    if (index !== -1) {
                        this.data.entries[index].title = title;
                        this.data.entries[index].content = content;
                        this.data.entries[index].updated = new Date().toISOString();
                    }
                } else {
                    // Create
                    const newEntry = {
                        id: Date.now().toString(),
                        notebookId: this.currentNotebook === 'all' ? 'default' : this.currentNotebook,
                        title: title,
                        content: content,
                        date: new Date().toISOString(),
                        updated: new Date().toISOString()
                    };
                    this.data.entries.push(newEntry);
                }

                this.saveData();
                this.closeEditor();
            }

            searchEntries(query) {
                if (!query) {
                    if(this.currentNotebook === 'all') this.showDashboard();
                    else this.showNotebook(this.currentNotebook);
                    return;
                }

                const lowerQ = query.toLowerCase();
                const filtered = this.data.entries.filter(e => 
                    e.title.toLowerCase().includes(lowerQ) || 
                    e.content.toLowerCase().includes(lowerQ)
                );

                const grid = document.getElementById('dashboardView').querySelector('.dashboard-grid');
                grid.innerHTML = '';
                
                if(filtered.length === 0) {
                    grid.innerHTML = '<div class="empty-state"><p>No matches found.</p></div>';
                } else {
                    filtered.forEach(entry => grid.appendChild(this.createEntryCard(entry)));
                }
                
                // Ensure we are showing the dashboard view context for search results
                document.getElementById('dashboardView').classList.remove('hidden');
                document.getElementById('notebookView').classList.add('hidden');
                document.querySelector('#dashboardView h2').innerText = `Search Results for "${query}"`;
            }

            // --- Theme ---
            toggleTheme() {
                const body = document.body;
                const current = body.getAttribute('data-theme');
                const next = current === 'dark' ? 'light' : 'dark';
                body.setAttribute('data-theme', next);
                localStorage.setItem('lumina_theme', next);
            }

            applyTheme() {
                const saved = localStorage.getItem('lumina_theme');
                if (saved) document.body.setAttribute('data-theme', saved);
            }
        }

        const app = new DiaryApp();
    </script>
</body>
</html>
